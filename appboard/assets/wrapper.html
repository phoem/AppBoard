<!doctype html>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; media-src data: blob:; frame-src about:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<style>html,body,iframe { margin:0; width:100%; height:100%; border:0; display:block; background:white }</style>
<iframe title="App content" sandbox="allow-scripts"></iframe>
<script>/* QT_CHANNEL */</script>
<script>
const frame = document.querySelector('iframe');
new QWebChannel(qt.webChannelTransport, channel => {
  const port = channel.objects.browserPort;
  window.addEventListener('message', e => {
    if (e.source !== frame.contentWindow || e.data?.type !== 'appboard:command') return;
    if (typeof e.data.action === 'string' && typeof e.data.value === 'string')
      port.request(e.data.action, e.data.value);
  });
  port.stateChanged.connect(state => frame.contentWindow.postMessage({type:'appboard:state', state}, '*'));
  const bytes = Uint8Array.from(atob('APPBOARD_GUEST_BASE64'), c => c.charCodeAt(0));
  frame.srcdoc = new TextDecoder().decode(bytes);
});
</script>
